name: macOS Build (reusable)

# Reusable workflow — invoke via
# uses: ./.github/workflows/_macos-build.yaml

on:
  workflow_call:
    inputs:
      cisst_saw_branch:
        description: 'cisst-saw branch to build, e.g. main or devel'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Homebrew cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew
        key: ${{ runner.os }}-brew-${{ inputs.cisst_saw_branch }}-${{ hashFiles('.github/workflows/_macos-build.yaml') }}
        restore-keys: |
          ${{ runner.os }}-brew-${{ inputs.cisst_saw_branch }}-
          ${{ runner.os }}-brew-

    - name: Install dependencies
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
        brew install graphviz jsoncpp qt pkg-config cppunit ccache python3 numpy swig
        echo "/opt/homebrew/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/qt/bin" >> $GITHUB_PATH

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ inputs.cisst_saw_branch }}-${{ hashFiles('.github/workflows/_macos-build.yaml') }}
        max-size: 1G
        ccache-command: ccache

    - name: Get all repositories
      env:
        CISST_SAW_BRANCH: ${{ inputs.cisst_saw_branch }}
      run: |
        git clone --branch "$CISST_SAW_BRANCH" --recursive https://github.com/jhu-cisst/cisst-saw "${{ github.workspace }}/cisst-saw"
        cd "${{ github.workspace }}/cisst-saw"
        git submodule foreach "git checkout $CISST_SAW_BRANCH"
        git submodule foreach "git submodule update --init --recursive"

    - name: Download cisstNetlib
      env:
        CISST_SAW_BRANCH: ${{ inputs.cisst_saw_branch }}
      run: |
        git clone --branch "$CISST_SAW_BRANCH" --depth 1 https://github.com/jhu-cisst/cisstNetlib "${{ github.workspace }}/../cisstNetlib-source"
        echo "CISSTNETLIB_HASH=$(git -C "${{ github.workspace }}/../cisstNetlib-source" rev-parse HEAD)" >> $GITHUB_ENV

    - name: Cache cisstNetlib build
      id: cache-cisstnetlib
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/../cisstNetlib-install
        key: ${{ runner.os }}-cisstnetlib-${{ inputs.cisst_saw_branch }}-${{ env.CISSTNETLIB_HASH }}

    - name: Build cisstNetlib
      if: steps.cache-cisstnetlib.outputs.cache-hit != 'true'
      run: |
        cmake -E make_directory "${{ github.workspace }}/../cisstNetlib-build"
        cd "${{ github.workspace }}/../cisstNetlib-build"
        cmake "${{ github.workspace }}/../cisstNetlib-source" \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/../cisstNetlib-install" \
          -DcisstNetlib_LANGUAGE=C \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build . --config Release --parallel "$(sysctl -n hw.ncpu)"
        cmake --build . --target install

    - name: Create Build Environment
      run: cmake -E make_directory "${{ github.workspace }}/build"

    - name: Configure CMake
      shell: bash
      working-directory: ${{ github.workspace }}/build
      run: |
        cmake "${{ github.workspace }}/cisst-saw" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt;/opt/homebrew" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCisstNetlib_DIR="${{ github.workspace }}/../cisstNetlib-install/share/cisstNetlib" \
          -C "${{ github.workspace }}/.github/workflows/cmake-macos-cache.cmake"

    - name: Build
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: cmake --build . --config Release --parallel "$(sysctl -n hw.ncpu)"

