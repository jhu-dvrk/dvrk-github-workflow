name: Ubuntu 26.04 ROS Lyrical

on:

  workflow_dispatch:

  schedule:
    - cron: '34 19 * * 0'

jobs:
  build:
    runs-on: ubuntu-26.04
    container:
      image: osrf/ros:lyrical-desktop

    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    - name: Setup ROS 2 Lyrical
      uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: lyrical

    - name: Ensure cache directory exists
      run: mkdir -p apt-cache

    - name: Cache APT packages
      uses: actions/cache@v4
      with:
        path: apt-cache
        key: ${{ runner.os }}-apt-lyrical-${{ hashFiles('.github/workflows/ubuntu-26-04-ros-lyrical.yaml') }}
        restore-keys: |
          ${{ runner.os }}-apt-lyrical-

    - name: Install base build tools
      run: |
        # Disable the automatic purging of the apt cache in docker images
        rm -f /etc/apt/apt.conf.d/docker-clean
        mkdir -p apt-cache
        APT_CACHE_DIR=$(pwd)/apt-cache
        echo "Dir::Cache::archives \"$APT_CACHE_DIR\";" | tee /etc/apt/apt.conf.d/10cache
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | tee /etc/apt/apt.conf.d/01keep-debs
        apt-get update
        apt-get install -y ccache ros-dev-tools python3-vcstool python3-colcon-common-extensions git subversion swig sox espeak qtcreator cmake-curses-gui cmake-qt-gui

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ hashFiles('.github/workflows/ubuntu-26-04-ros-lyrical.yaml') }}
        max-size: 1G

    - name: ccache stats (before)
      run: ccache -s

    - name: Create Workspace and retrieve code
      shell: bash
      run: |
        source /opt/ros/lyrical/setup.bash
        mkdir -p ~/ros2_ws/src
        cd ~/ros2_ws/src
        vcs import --input https://raw.githubusercontent.com/jhu-saw/vcs/main/ros2-dvrk-main.vcs --recursive

    - name: Install dependencies with rosdep
      shell: bash
      run: |
        source /opt/ros/lyrical/setup.bash
        cd ~/ros2_ws
        rosdep update
        rosdep install --from-paths src --ignore-src -y --rosdistro lyrical

    - name: Compile
      shell: bash
      env:
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_NOHASHDIR: "true"
        CCACHE_COMPRESS: "true"
      run: |
        source /opt/ros/lyrical/setup.bash
        cd ~/ros2_ws
        colcon build --cmake-args -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: ccache stats (after)
      run: ccache -s
